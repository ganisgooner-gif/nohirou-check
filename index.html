<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脳疲労タイプ診断｜かみふくろう整骨院・整体院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F1; --card:#FFFFFF; --ink:#5B4332; --ink-soft:#8C7563; --brand:#96735A; --brand-deep:#6E5340;
  --accent:#E8917A; --accent-soft:#FBE7DF; --accent-deep:#B5614B; --line:#EADFD4;
  --hot:#D9534F; --hot-soft:#FBE1DF; --hot-ink:#B23B36; --rest:#3E9C7A; --rest-soft:#E3F2EC; --rest-ink:#1E6B50; --line-green:#06C755;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem 2.5rem;line-height:1.6}
.container{max-width:560px;width:100%}
.header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding:0 4px}
.header img{width:32px;height:auto;flex-shrink:0}
.header h1{font-size:17px;font-weight:900;color:var(--brand);letter-spacing:0.02em;line-height:1.3}
.header .clinic{font-size:11px;color:var(--ink-soft);margin-left:auto;text-align:right;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.5rem 1.15rem}

/* 質問画面 */
.lead{font-size:13px;color:var(--ink-soft);line-height:1.75;margin-bottom:1rem}
.progress-wrap{margin-bottom:1.5rem}
.progress-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s ease}
.dot-row{display:none}
.q-counter{font-size:12px;color:var(--ink-soft);text-align:center}
.q-category{display:none}
.q-text{font-size:19px;font-weight:700;color:var(--ink);line-height:1.7;text-align:center;margin-bottom:1.75rem;min-height:66px;text-wrap:balance;overflow-wrap:anywhere}
.scale-wrap{display:flex;flex-direction:column;align-items:center;gap:0.75rem;margin-bottom:1.75rem}
.circles{display:flex;gap:14px;align-items:center;justify-content:center}
.circle-btn{border-radius:50%;border:3px solid;background:transparent;cursor:pointer;transition:transform 0.2s cubic-bezier(.34,1.56,.64,1),background 0.15s;outline:none;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.circle-btn:hover{transform:scale(1.12)}
.circle-btn:active{transform:scale(0.92)}
.circle-btn:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--brand)}
.circle-btn.selected{animation:circlePop 0.35s cubic-bezier(.34,1.56,.64,1)}
@keyframes circlePop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.c1{width:56px;height:56px;border-color:var(--accent)}
.c2{width:46px;height:46px;border-color:#F0B9A8}
.c3{width:38px;height:38px;border-color:#D9CFC5}
.c4{width:46px;height:46px;border-color:#C9B4A3}
.c5{width:56px;height:56px;border-color:var(--brand)}
.c1.selected{background:var(--accent)}
.c2.selected{background:#F0B9A8}
.c3.selected{background:#D9CFC5}
.c4.selected{background:#C9B4A3}
.c5.selected{background:var(--brand)}
.scale-labels{display:flex;justify-content:space-between;width:100%;max-width:300px;font-size:13px;font-weight:700}
.scale-labels .lbl-l{color:var(--accent-deep)}
.scale-labels .lbl-r{color:var(--brand)}
.nav-row{display:flex;justify-content:space-between;align-items:center}
.nav-btn{padding:0.7rem 1.4rem;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit}
.nav-btn:hover{background:var(--bg)}
.nav-btn:disabled{opacity:0.3;cursor:default}
.nav-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.nav-btn.primary:hover{background:var(--brand-deep)}

/* 結果画面 */
.result{display:none}
.result.show{display:block}
.result-title{font-size:20px;font-weight:900;text-align:center;color:var(--brand);margin-bottom:4px}
.result-sub{font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:1rem;line-height:1.6}
.sec-head{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:900;color:var(--brand);margin:1.4rem 0 0.7rem;padding-left:10px;border-left:4px solid var(--accent);line-height:1.4}
.sec-head.first{margin-top:0.25rem}
.sec-sub{font-size:11px;font-weight:500;color:var(--ink-soft)}
.hero{background:var(--brand-deep);color:#fff;border-radius:22px;padding:1.25rem 1.1rem 1.1rem;text-align:center;box-shadow:0 10px 26px rgba(90,60,40,0.22)}
.hero-top{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:0.75rem}
.hero-rank{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#fff;flex-shrink:0;box-shadow:0 8px 18px rgba(0,0,0,0.25);background:var(--accent)}
.hero-main{text-align:left}
.hero-caption{font-size:11px;opacity:.75;font-weight:700}
.hero-score{font-size:44px;font-weight:900;line-height:1.05}
.hero-score span{font-size:15px;font-weight:700;opacity:.8;margin-left:2px}
.hero-label{font-size:14px;font-weight:700;color:#F6C9BB;margin-top:2px}
.hero-line{font-size:18px;font-weight:800;line-height:1.6;margin:0.4rem 0 0.8rem;text-wrap:balance}
.hero-line b{white-space:nowrap}
.hero-line b.over{color:#F6A892}
.hero-line b.dorm{color:#A8E3CB}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:800;line-height:1.3;background:rgba(255,255,255,0.14);border:1.5px solid rgba(255,255,255,0.35);color:#fff}
.chip.over{border-color:#F6A892;color:#FFD9CF}
.chip.dorm{border-color:#A8E3CB;color:#D4F3E6}
.chip.ok{border-color:rgba(255,255,255,0.6);color:#fff}
.compare-card{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0.8rem 0.95rem;font-size:13px;line-height:1.7}
.compare-title{font-size:12px;font-weight:800;color:var(--brand);margin-bottom:2px}
.compare-score-row{color:var(--ink);padding-bottom:4px;margin-bottom:4px;border-bottom:1px dashed var(--line)}
.compare-item{color:var(--ink)}
.compare-hint{text-align:center;color:var(--ink-soft);font-size:12px}
.trend-line{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0.85rem 0.95rem;text-align:center;font-size:15px;font-weight:800;line-height:1.7;margin-bottom:0.5rem}
.trend-line b{color:var(--brand);white-space:nowrap}
.trend-line.first{font-size:13px;font-weight:500;color:var(--ink-soft)}
.trend-line.suggest{background:var(--accent-soft);border-color:#F3CFC2;font-size:14px;font-weight:700}
.trend-line.suggest b{color:var(--accent-deep)}
.trend-label{display:block;font-size:11px;font-weight:700;color:var(--accent-deep);margin-bottom:2px}
.bg-section{margin-bottom:0.5rem}
.bg-wrap{position:relative;width:100%;max-width:520px;margin:0.75rem auto 0}
.bg-wrap canvas{display:block;width:100%;height:auto}
.bg-badge{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--brand);font-size:11px;font-weight:900;color:var(--ink);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,0.18);pointer-events:none}
.bg-foot{text-align:center;font-size:11px;color:var(--ink-soft);margin:0.25rem 0 0.5rem}
.bg-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.bg-row:last-child{border-bottom:none}
.bg-row-badge{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--brand);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink)}
.bg-row-main{flex:1;min-width:0}
.bg-row-name{font-size:14px;font-weight:800;color:var(--ink)}
.bg-row-desc{font-size:11px;color:var(--ink-soft);margin-top:1px}
.bg-row-score{font-size:12px;color:var(--ink-soft);text-align:right;flex-shrink:0;line-height:1.5}
.bg-tag{font-size:10px;padding:3px 8px;border-radius:99px;font-weight:800;min-width:52px;text-align:center;flex-shrink:0;white-space:nowrap}
.bg-tag.over{background:var(--hot-soft);color:var(--hot-ink)}
.bg-tag.dorm{background:var(--rest-soft);color:var(--rest-ink)}
.bg-tag.none{visibility:hidden}
.fullbar-section{margin-bottom:1rem}
.fullbar-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:0.75rem}
.fullbar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fullbar-label{font-size:12px;width:90px;flex-shrink:0;text-align:right}
.fullbar-track{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.fullbar-fill{height:100%;border-radius:99px;transition:width 0.7s ease}
.fullbar-fill.overuse{background:var(--hot)}
.fullbar-fill.dormant{background:var(--rest)}
.fullbar-fill.neutral{background:#C9B4A3}
.fullbar-score{font-size:11px;width:22px;text-align:right;color:var(--ink-soft);flex-shrink:0}
.fullbar-tag{font-size:10px;padding:1px 6px;border-radius:99px;flex-shrink:0;font-weight:700}
.fullbar-tag.overuse{background:var(--hot-soft);color:var(--hot-ink)}
.fullbar-tag.dormant{background:var(--rest-soft);color:var(--rest-ink)}
.fullbar-tag.neutral{display:none}
.cta-card{margin-top:1.4rem;text-align:center}
.cta-title{font-size:14px;font-weight:900;color:var(--brand);margin-bottom:10px}
.cta-btns{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.btn-line{display:block;background:var(--line-green);color:#fff;font-weight:800;font-size:15px;padding:0.8rem;border-radius:99px;text-decoration:none}
.btn-site{display:block;background:#fff;color:var(--brand);font-weight:800;font-size:14px;padding:0.7rem;border-radius:99px;border:1.5px solid var(--brand);text-decoration:none}
.restart-btn{margin-top:0.9rem;display:block;width:100%;padding:0.7rem;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.restart-btn:hover{background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function shuffleArray(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}

// カテゴリーのプールから重複なくn問だけランダムに選ぶ
function sampleQuestions(pool,n){
  var shuffled=shuffleArray(pool);
  return shuffled.slice(0,Math.min(n,shuffled.length));
}

    var picked=sampleQuestions(questionPool[key],QUESTIONS_PER_CATEGORY);
    picked.forEach(function(q){
      result.push({text:q.text,category:meta.category,key:key,label:meta.label,brain:meta.brain,invert:q.invert});
    });
  });
  return shuffleArray(result); // カテゴリー順ではなく毎回バラバラの順で出題
}

var questions=buildQuestions();

var answers={};
var current=0;

function initDots(){
  var d=document.getElementById('dot-row');d.innerHTML='';
  for(var i=0;i<questions.length;i++){
    var s=document.createElement('div');
    s.className='dot'+(i===0?' current':'');s.id='dot'+i;d.appendChild(s);
  }
}
function updateDots(){
  for(var i=0;i<questions.length;i++){
    var el=document.getElementById('dot'+i);
    if(i===current)el.className='dot current';
    else if(answers[i]!==undefined)el.className='dot done';
    else el.className='dot';
  }
}
function renderQ(){
  var q=questions[current];
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('q-category').textContent=q.category;
  document.getElementById('q-counter').textContent=(current+1)+' / '+questions.length;
  document.getElementById('prog').style.width=Math.round((current+1)/questions.length*100)+'%';
  document.querySelectorAll('.circle-btn').forEach(function(b){
    b.classList.remove('selected');
    if(answers[current]!==undefined&&parseInt(b.dataset.val)===answers[current])b.classList.add('selected');
  });
  document.getElementById('next-btn').disabled=(answers[current]===undefined);
  document.getElementById('prev-btn').disabled=(current===0);
  updateDots();
}
function selectVal(val){
  answers[current]=val;
  document.querySelectorAll('.circle-btn').forEach(function(b){b.classList.remove('selected');});
  document.querySelector('[data-val="'+val+'"]').classList.add('selected');
  document.getElementById('next-btn').disabled=false;
  setTimeout(function(){
    if(current<questions.length-1){current++;renderQ();}else showResult();
  },380);
}
function next(){if(answers[current]===undefined)return;if(current<questions.length-1){current++;renderQ();}else showResult();}
function prev(){if(current>0){current--;renderQ();}}

function calcScores(){
  var totals={};var counts={};
  questions.forEach(function(q,i){
    if(!totals[q.key]){totals[q.key]=0;counts[q.key]=0;}
    var raw=answers[i]||3;
    totals[q.key]+=(q.invert?(6-raw):raw);
    counts[q.key]++;
  });
  return categoryOrder.map(function(k){
    var q=questions.find(function(q){return q.key===k;});
    return{key:k,label:q.label,brain:q.brain,score:parseFloat((totals[k]/counts[k]).toFixed(2))};
  });
}

function calcFatigueScore(scored){
  var byKey={};
  scored.forEach(function(s){byKey[s.key]=s.score;});
  // command/emotion/memory は高いほど疲弊、movement/mindwander は低いほど不足（6-scoreで疲労側に揃える）
  var fatigueSum=byKey.command+byKey.emotion+byKey.memory+(6-byKey.movement)+(6-byKey.mindwander);
  var fatigue=Math.round(((fatigueSum-5)/20)*100); // 0〜100、高いほど脳疲労度が高い
  fatigue=Math.max(0,Math.min(100,fatigue));
  var rank,label;
  if(fatigue<20){rank='S';label='絶好調タイプ';}
  else if(fatigue<40){rank='A';label='バランス良好タイプ';}
  else if(fatigue<60){rank='B';label='ややお疲れタイプ';}
  else if(fatigue<80){rank='C';label='お疲れ気味タイプ';}
  else{rank='D';label='要注意タイプ';}
  return{score:fatigue,rank:rank,label:label};
}


// ===== 前回結果の保存・比較（localStorageのみ・同一端末限定の軽量版） =====
var PREV_RESULT_KEY='nohirouCheckLastResult_v1';
var COMPARE_THRESHOLD=0.6; // これ以上の差があれば「変化あり」とみなす（1〜5点スケール）

var HISTORY_KEY='nohirouCheckHistory_v1'; // 受けた結果を何回分も積み上げて保存する
var HISTORY_MAX=30;   // 保存する最大回数（古いものから消える）
var AVG_N=5;          // ゲージに使う「直近の平均」の回数

function isValidRecord(rec){
  return !!(rec&&rec.scores&&categoryOrder.every(function(k){return typeof rec.scores[k]==='number';}));
}

function loadRecords(){
  try{
    var raw=localStorage.getItem(HISTORY_KEY);
    if(raw){
      var arr=JSON.parse(raw);
      if(Array.isArray(arr))return arr.filter(isValidRecord);
    }
    // 旧版（1回分だけ保存）の記録があれば、最初の1回として引き継ぐ
    var old=localStorage.getItem(PREV_RESULT_KEY);
    if(old){
      var d=JSON.parse(old);
      if(isValidRecord(d))return [d];
    }
  }catch(e){}
  return [];
}

function saveRecords(arr){
  try{
    localStorage.setItem(HISTORY_KEY,JSON.stringify(arr.slice(-HISTORY_MAX)));
  }catch(e){/* 保存できない環境（プライベートモード等）では何もしない */}
}

// 直近n回の平均（区分ごと）
function averageScores(recs,n){
  var take=recs.slice(Math.max(0,recs.length-n));
  var res={};
  categoryOrder.forEach(function(k){
    var s=0;take.forEach(function(r){s+=r.scores[k];});
    res[k]=s/take.length;
  });
  return res;
}

// movement/mindwander は「スコアが高い＝良い」なので、疲労方向にそろえてから比較する
function fatigueDirection(key,score){
  return(key==='movement'||key==='mindwander')?(6-score):score;
}

function compareWithPrevious(scored,prevScores){
  return categoryOrder.map(function(k){
    var meta=categoryMeta[k];
    var cur=scored.find(function(s){return s.key===k;}).score;
    var prev=prevScores[k];
    var delta=fatigueDirection(k,cur)-fatigueDirection(k,prev);
    return{key:k,label:meta.label,emoji:meta.emoji,delta:delta};
  }).filter(function(item){return Math.abs(item.delta)>=COMPARE_THRESHOLD;})
    .sort(function(a,b){return Math.abs(b.delta)-Math.abs(a.delta);});
}

var resultShown=false;
function showResult(){
  if(resultShown)return; // 「次へ」と自動送りが重なっても、記録を二重に積まない
  resultShown=true;
  document.getElementById('q-screen').style.display='none';
  var rs=document.getElementById('result-screen');
  rs.classList.add('show');

  var scored=calcScores();
  var sortedByScore=[].concat(scored).sort(function(a,b){return b.score-a.score;});
  var overuse=sortedByScore.filter(function(x){return x.score>=4.0;}).slice(0,3);
  var dormant=sortedByScore.filter(function(x){return x.score<=2.0;}).reverse().slice(0,3);

  var fatigue=calcFatigueScore(sortedByScore);
  var overuseKeys=overuse.map(function(x){return x.key;});
  var dormantKeys=dormant.map(function(x){return x.key;});

  var recordsBefore=loadRecords();
  var prevResult=recordsBefore.length?recordsBefore[recordsBefore.length-1]:null;
  var nowRecord={ts:Date.now(),scores:{}};
  scored.forEach(function(s){nowRecord.scores[s.key]=s.score;});
  var allRecords=recordsBefore.concat([nowRecord]);
  var avgScores=averageScores(allRecords,AVG_N);
  var comparison=prevResult?compareWithPrevious(scored,prevResult.scores):[];
  var prevFatigue=prevResult?calcFatigueScore(categoryOrder.map(function(k){return{key:k,score:prevResult.scores[k]};})):null;

  var html='<div class="result-title">あなたの脳疲労レポート</div>';
  html+='<div class="result-sub">今日頑張った回路と、休んでいた回路がわかりました</div>';

  html+='<div class="hero-line">'+todaySentence(overuse,dormant)+'</div>';
  html+='<div class="chips">';
  overuse.forEach(function(x){html+='<div class="chip over">'+(categoryMeta[x.key]?categoryMeta[x.key].emoji:'')+' '+x.label+'：頑張った</div>';});
  dormant.forEach(function(x){html+='<div class="chip dorm">'+(categoryMeta[x.key]?categoryMeta[x.key].emoji:'')+' '+x.label+'：お休み</div>';});
  if(!overuse.length&&!dormant.length)html+='<div class="chip ok">✨ バランス良好</div>';
  html+='</div></div>';

  // 前回との比較（同じ端末での再受診時のみ）
  if(prevResult){
    html+='<div class="compare-card"><div class="compare-title">前回との比較</div>';
    var scoreTrendIcon=fatigue.score<prevFatigue.score?'🔽':(fatigue.score>prevFatigue.score?'🔼':'➡️');
    html+='<div class="compare-score-row">前回：<b>'+prevFatigue.score+'点</b>（'+prevFatigue.rank+'ランク） '+scoreTrendIcon+' 今回：<b>'+fatigue.score+'点</b>（'+fatigue.rank+'ランク）</div>';
    if(comparison.length>0){
      comparison.slice(0,2).forEach(function(item){
        var trend=item.delta<0?'回復傾向です':'お疲れ気味です';
        html+='<div class="compare-item">'+item.emoji+' '+item.label+'：前回より'+trend+'</div>';
      });
    } else {
      html+='<div class="compare-item">カテゴリー別では大きな変化はありませんでした</div>';
    }
    html+='</div>';
  } else {
    html+='<div class="compare-card compare-hint">次回もこの端末で受けると、前回との比較が見られます</div>';
  }

  // ===== あなたの傾向 =====
  // あなたの傾向（たまった記録から）
  html+=buildBrainSection(scored,avgScores,allRecords.length);
  html+='<div id="bars-fallback" style="display:none"><div class="fullbar-section"><div class="fullbar-title">脳の回路バランス（全5項目）</div>';
  scored.forEach(function(item){
    var pct=Math.round((item.score-1)/4*100);
    var isOver=overuseKeys.indexOf(item.key)>=0;
    var isDorm=dormantKeys.indexOf(item.key)>=0;
    var cls=isOver?'overuse':isDorm?'dormant':'neutral';
    var tag=isOver?'<span class="fullbar-tag overuse">頑張った</span>':isDorm?'<span class="fullbar-tag dormant">お休み</span>':'<span class="fullbar-tag neutral"></span>';
    html+='<div class="fullbar-row"><div class="fullbar-label">'+(categoryMeta[item.key]?categoryMeta[item.key].emoji:'')+' '+item.label+'</div><div class="fullbar-track"><div class="fullbar-fill '+cls+'" style="width:0%" data-w="'+pct+'%"></div></div><div class="fullbar-score">'+item.score+'</div>'+tag+'</div>';
  });
  html+='</div></div>';


  html+='<div class="cta-card"><div class="cta-title">脳のバランスを身体から整えたい方へ</div>';
  html+='<div class="cta-btns">';
  html+='<a class="btn-line" href="https://lin.ee/tdz9yCv" target="_blank" rel="noopener">&#10004; LINEで友だち追加して相談する</a>';
  html+='<a class="btn-site" href="https://kamifukurou.com" target="_blank" rel="noopener">&#127968; かみふくろう整骨院・整体院 公式サイトを見る</a>';
  html+='</div></div>';
  html+='<button class="restart-btn" onclick="restart()">↺ もう一度診断する</button>';

  rs.innerHTML=html;
  setTimeout(function(){
    rs.querySelectorAll('[data-w]').forEach(function(b){b.style.width=b.getAttribute('data-w');});
  },100);
  startBrainGauge(avgScores); // ゲージは「あなたの傾向」（直近の平均）
  saveRecords(allRecords); // 今回の結果を記録に積み上げる
}

// 絵の各画素を「白に色が混ざったもの」とみなして、いちばん近い領域に振り分ける
function classifyPixels(data,w,h){
  var n=w*h;
  var region=new Int8Array(n);
  var cvec=BRAIN_PAL.map(function(c){return [c[0]-255,c[1]-255,c[2]-255];});
  var ccs=cvec.map(function(v){return v[0]*v[0]+v[1]*v[1]+v[2]*v[2];});
  var bbox=[];
  for(var k=0;k<5;k++)bbox.push({y0:1e9,y1:-1});
  for(var i=0;i<n;i++){
    var dx=data[4*i]-255,dy=data[4*i+1]-255,dz=data[4*i+2]-255;
    var dw=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(dw<14){region[i]=-1;continue;}
    var best=1e9,bi=-1,bestA=0;
    for(var k2=0;k2<6;k2++){
      var c=cvec[k2];
      var a=(dx*c[0]+dy*c[1]+dz*c[2])/ccs[k2];
      if(a<0)a=0;else if(a>1)a=1;
      var ex=dx-a*c[0],ey=dy-a*c[1],ez=dz-a*c[2];
      var res=Math.sqrt(ex*ex+ey*ey+ez*ez);
      if(res<best){best=res;bi=k2;bestA=a;}
    }
    region[i]=bi;
    // 領域の上下の端は、色がしっかり乗った画素だけで決める
    if(bi<5&&best<25&&bestA>=0.85){
      var yy=(i/w)|0;
      if(yy<bbox[bi].y0)bbox[bi].y0=yy;
      if(yy>bbox[bi].y1)bbox[bi].y1=yy;
    }
  }
  return {region:region,bbox:bbox,w:w,h:h};
}

// levels：5つの領域それぞれ 0〜1。領域の下から、その割合まで色が満ちる
// hot：赤にする領域（true/false）。満ちた部分を赤に置き換え、空の部分は元の色を薄く残す
var HOT_RGB=[226,75,74]; // #E24B4A
function paintGauge(base,info,levels,out,hot){
  var w=info.w,n=w*info.h;
  var pal=BRAIN_PAL;
  for(var i=0;i<n;i++){
    var k=info.region[i];
    var r=base[4*i],g=base[4*i+1],b=base[4*i+2];
    if(k>=0&&k<5){
      var bb=info.bbox[k];
      var L=levels[k];
      var yy=(i/w)|0;
      var yFill=bb.y1+1-L*(bb.y1-bb.y0+1);
      var filled=(L>0&&yy>=yFill);
      if(!filled){
        r=255+(r-255)*0.2;g=255+(g-255)*0.2;b=255+(b-255)*0.2;
      } else if(hot&&hot[k]){
        // 元の色からの濃淡（白への混ざり具合）を保ったまま、赤に置き換える
        var c=pal[k];
        var cc=(c[0]-255)*(c[0]-255)+(c[1]-255)*(c[1]-255)+(c[2]-255)*(c[2]-255);
        var a=((r-255)*(c[0]-255)+(g-255)*(c[1]-255)+(b-255)*(c[2]-255))/cc;
        if(a<0)a=0;else if(a>1)a=1;
        r=255+(HOT_RGB[0]-255)*a;g=255+(HOT_RGB[1]-255)*a;b=255+(HOT_RGB[2]-255)*a;
      }
    }
    out[4*i]=r;out[4*i+1]=g;out[4*i+2]=b;out[4*i+3]=255;
  }
}

// 平均から、傾向を一文にする
function trendSentence(avg){
  var over=BRAIN_META.filter(function(m){return avg[m.key]>=4.0;}).sort(function(a,b){return avg[b.key]-avg[a.key];});
  var dorm=BRAIN_META.filter(function(m){return avg[m.key]<=2.0;}).sort(function(a,b){return avg[a.key]-avg[b.key];});
  var names=function(arr){return arr.slice(0,2).map(function(m){return '<b>'+m.name+'</b>';}).join('と');};
  if(over.length&&dorm.length)return names(over)+'をよく使い、'+names(dorm)+'が休みがちな傾向です';
  if(over.length)return names(over)+'をよく使う傾向です';
  if(dorm.length)return '全体は落ち着いていますが、'+names(dorm)+'が休みがちな傾向です';
  return 'どの回路もほどよく使われている傾向です';
}

function trendSuggestion(avg){

  var dorm=BRAIN_META.filter(function(m){return avg[m.key]<=2.0;}).sort(function(a,b){return avg[a.key]-avg[b.key];});
  var lines=[];

function buildBrainSection(scored,avg,n){
  var today={};

  var h='<div id="brain-section" class="bg-section">';

    h+='<div class="trend-line suggest"><span class="trend-label">提案</span>'+trendSuggestion(avg)+'</div>';
  } else {
    h+='<div class="trend-line first">まだ1回目です。回数を重ねると、あなたの脳の使われ方のくせが見えてきます。</div>';
    h+='<div class="trend-line suggest"><span class="trend-label">今日の提案</span>'+trendSuggestion(avg)+'</div>';
  }
  h+='<div class="bg-wrap"><canvas id="brain-canvas" width="720" height="720" role="img" aria-label="脳を5つの領域に分けた模式図。領域ごとにゲージが満ちる"></canvas>';
  BRAIN_META.forEach(function(m,idx){
    m.pts.forEach(function(p){
      h+='<div class="bg-badge" style="left:'+(p[0]*100)+'%;top:'+(p[1]*100)+'%;border-color:'+m.color+'">'+(idx+1)+'</div>';
    });
  });
  h+='</div>';
  h+='<div class="bg-foot">記録 '+n+'回目（この端末）</div>';
  BRAIN_META.forEach(function(m,idx){
    var v=avg[m.key];
    var tag='none',tagText='・';
    if(v>=HOT_THRESHOLD){tag='over';tagText='頑張った';}
    else if(v<=2.0){tag='dorm';tagText='お休み';}
    var badgeColor=(v>=HOT_THRESHOLD)?'#E24B4A':m.color;
    var scoreText=(n>1?'平均 '+v.toFixed(1)+'<br>今回 '+today[m.key].toFixed(1):'今回 '+today[m.key].toFixed(1));
    h+='<div class="bg-row"><div class="bg-row-badge" style="border-color:'+badgeColor+'">'+(idx+1)+'</div>'
      +'<div class="bg-row-main"><div class="bg-row-name">'+m.name+'</div><div class="bg-row-desc">'+m.desc+'</div></div>'
      +'<div class="bg-row-score">'+scoreText+'</div>'
      +'<div class="bg-tag '+tag+'">'+tagText+'</div></div>';
  });
  h+='</div>';
  return h;
}

function showBarsFallback(){
  var s=document.getElementById('brain-section');
  var f=document.getElementById('bars-fallback');
  if(s)s.style.display='none';
  if(f)f.style.display='block';
}

function brainDrawFrame(levels){
  if(!brainCtx)return;
  paintGauge(brainBase,brainInfo,levels,brainOut.data,brainHot);
  brainCtx.putImageData(brainOut,0,0);
}

function runBrainAnimation(){
  var c=document.getElementById('brain-canvas');
  if(!c||!brainPending)return;
  brainCtx=c.getContext('2d');
  brainOut=brainCtx.createImageData(brainW,brainH);
  var target=brainPending;
  var cur=[0,0,0,0,0];
  brainDrawFrame(cur);
  var t0=performance.now();
  var myId=++brainAnimId;
  function step(t){
    if(myId!==brainAnimId)return;
    var p=Math.min(1,(t-t0)/1000);
    var e=1-Math.pow(1-p,3);
    for(var i=0;i<5;i++)cur[i]=target[i]*e;
    brainDrawFrame(cur);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// 点数（1〜5）をゲージの高さ（0〜1）に変える
// 「眠り」の境目（2.0点）でほぼ空、「疲弊」の境目（4.0点）でほぼ満杯に見えるようにする
var LEVEL_POINTS=[[1,0],[2,0.12],[3,0.5],[4,0.88],[5,1]];
function scoreToLevel(s){
  if(s<=1)return 0;
  if(s>=5)return 1;
  for(var i=1;i<LEVEL_POINTS.length;i++){
    var a=LEVEL_POINTS[i-1],b=LEVEL_POINTS[i];
    if(s<=b[0])return a[1]+(b[1]-a[1])*(s-a[0])/(b[0]-a[0]);
  }
  return 1;
}

function startBrainGauge(avg){
  brainPending=BRAIN_META.map(function(m){return scoreToLevel(avg[m.key]);});
  brainHot=BRAIN_META.map(function(m){return avg[m.key]>=HOT_THRESHOLD;});
  if(brainFailed){showBarsFallback();return;}
  if(brainReady)runBrainAnimation();
}

(function loadBrainImage(){
  var img=new Image();
  img.onload=function(){
    try{
      var off=document.createElement('canvas');
      off.width=img.naturalWidth;off.height=img.naturalHeight;
      var octx=off.getContext('2d');
      octx.drawImage(img,0,0);
      var im=octx.getImageData(0,0,off.width,off.height);
      brainBase=im.data;
      brainW=off.width;brainH=off.height;
      brainInfo=classifyPixels(brainBase,brainW,brainH);
      brainReady=true;
      if(brainPending&&document.getElementById('brain-canvas'))runBrainAnimation();
    }catch(e){
      brainFailed=true;
      if(brainPending)showBarsFallback();
    }
  };
  img.onerror=function(){
    brainFailed=true;
    if(brainPending)showBarsFallback();
  };
  img.src=BRAIN_IMG_SRC;
})();

initDots();renderQ();
</script>
