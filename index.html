<style>

<div class="container">
  <div class="header">
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
    <h1>🧠 脳疲労タイプ診断</h1>
    <p>今日の活動を振り返りながら答えてください<br>使いすぎている脳の回路と、眠っている回路がわかります</p>

      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>

<script>
// ===== カテゴリー基本情報（5カテゴリー版：司令塔・感情・記憶・運動・ぼんやり） =====
var categoryMeta={

  memory:{category:"記憶",label:"記憶",brain:"海馬・前頭前野・基底核・小脳",emoji:"🧩"},
  movement:{category:"運動",label:"運動",brain:"小脳・基底核・一次運動野・運動前野・前庭神経系",emoji:"🏃"},
  mindwander:{category:"ぼんやり",label:"ぼんやり",brain:"デフォルトモードネットワーク（DMN）・前頭前野の活動低下",emoji:"☁️"}
};

// ===== カテゴリーごとの設問プール（各10問。追加していくと自動的に出題バリエーションが増える） =====
// invert:true は「そう思う」＝その回路が眠っている（やらなかった）、という向きの設問

  command:[
    {text:"今日は話す・聞く・読む・書くことが多かったと感じた",invert:false},

    {text:"数字やグラフを見比べて考える時間が長かった",invert:false},
    {text:"「どう説明すればわかりやすいか」を考える場面が多かった",invert:false},
    {text:"会議や打ち合わせで、何かを決める場面が多かった",invert:false},
    {text:"「どっちがいいだろう」と選択に迷う場面が多かった",invert:false},
    {text:"集中力を切らさないように意識し続ける時間が長かった",invert:false},
    {text:"周りの音や人の動きが気になって、集中が途切れることがあった",invert:false}
  ],
  emotion:[
    {text:"感情を表に出さないよう、気持ちを抑える場面が多かった",invert:false},
    {text:"苛立ちや不安を感じても、顔や態度には出さないようにした",invert:false},
    {text:"誰かの機嫌や反応を気にしながら過ごす時間が長かった",invert:false},
    {text:"言いたいことを飲み込んで、我慢する場面があった",invert:false},
    {text:"些細なことで、イライラや不安が繰り返し湧いてきた",invert:false},
    {text:"息が浅くなったり、胸のあたりが締め付けられる感覚があった",invert:false},
    {text:"緊張する場面が多く、肩や体に力が入りっぱなしだった",invert:false},
    {text:"予定外の出来事に、とっさに対応しなければならない場面があった",invert:false},
    {text:"急な連絡や割り込みに、反射的に反応することが多かった",invert:false},
    {text:"ヒヤッとする瞬間があり、一瞬身構えることがあった",invert:false}
  ],
  memory:[
    {text:"新しく覚えることが多く、頭の中がいっぱいになった",invert:false},
    {text:"複数の予定やタスクを同時に頭に入れておく必要があった",invert:false},
    {text:"「あれ、さっき何しようとしてたっけ」と忘れることがあった",invert:false},
    {text:"名前や顔を覚えることに気を使う場面が多かった",invert:false},
    {text:"メモを取らないと覚えていられないと感じることがあった",invert:false},
    {text:"昨日や数日前のことを思い出そうとして、なかなか出てこなかった",invert:false},
    {text:"新しいやり方や手順を覚えようとする場面があった",invert:false},
    {text:"人から聞いた話をあとで思い出そうとして、記憶をたどることがあった",invert:false},

    {text:"手先を使う細かい作業や、丁寧な動きをする場面がなかった",invert:true},

var categoryOrder=["command","emotion","memory","movement","mindwander"];

// 1カテゴリーあたり何問出題するか（プールを増やしてもここは変えなくてよい）
var QUESTIONS_PER_CATEGORY=2;

function shuffleArray(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}

// カテゴリーのプールから重複なくn問だけランダムに選ぶ
function sampleQuestions(pool,n){
  var shuffled=shuffleArray(pool);
  return shuffled.slice(0,Math.min(n,shuffled.length));
}

// 毎回のセッションで出題する10問（5カテゴリー×2問。プール数が増えれば自動的に組み合わせが増える）
function buildQuestions(){
  var result=[];
  categoryOrder.forEach(function(key){
    var meta=categoryMeta[key];
    var picked=sampleQuestions(questionPool[key],QUESTIONS_PER_CATEGORY);
    picked.forEach(function(q){
      result.push({text:q.text,category:meta.category,key:key,label:meta.label,brain:meta.brain,invert:q.invert});
    });
  });
  return shuffleArray(result); // カテゴリー順ではなく毎回バラバラの順で出題
}

var questions=buildQuestions();

// ===== 眠っている回路への回復プログラム（5カテゴリー版） =====
var recoveryAdvice={
  command:{
    tonight:["日記や明日の予定を3行だけ書き出す","家計簿や簡単な数字の整理を10分だけやってみる"],
    week:["週2回、文章を声に出して読む時間をつくる","小さな決断を自分の意思で素早く行う練習をする"],
    clinic:["当院の休息プログラムの目標設計セッションで、考える機会を意図的につくる","施術後に方針を一緒に言語化し、思考の回路を軽く動かす"]
  },
  emotion:{

var combos=[

var refTable=[
  {label:"司令塔",brain:"前頭前野・頭頂連合野・言語野（ブローカ野／ウェルニッケ野）",key:"command"},

];

var answers={};
var current=0;

function initDots(){
  var d=document.getElementById('dot-row');d.innerHTML='';
  for(var i=0;i<questions.length;i++){
    var s=document.createElement('div');
    s.className='dot'+(i===0?' current':'');s.id='dot'+i;d.appendChild(s);
  }
}
function updateDots(){
  for(var i=0;i<questions.length;i++){
    var el=document.getElementById('dot'+i);
    if(i===current)el.className='dot current';
    else if(answers[i]!==undefined)el.className='dot done';
    else el.className='dot';
  }
}
function renderQ(){
  var q=questions[current];
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('q-category').textContent=q.category;
  document.getElementById('q-counter').textContent=(current+1)+' / '+questions.length;
  document.getElementById('prog').style.width=Math.round((current+1)/questions.length*100)+'%';
  document.querySelectorAll('.circle-btn').forEach(function(b){
    b.classList.remove('selected');
    if(answers[current]!==undefined&&parseInt(b.dataset.val)===answers[current])b.classList.add('selected');
  });
  document.getElementById('next-btn').disabled=(answers[current]===undefined);
  document.getElementById('prev-btn').disabled=(current===0);
  updateDots();
}
function selectVal(val){
  answers[current]=val;
  document.querySelectorAll('.circle-btn').forEach(function(b){b.classList.remove('selected');});
  document.querySelector('[data-val="'+val+'"]').classList.add('selected');
  document.getElementById('next-btn').disabled=false;
  setTimeout(function(){
    if(current<questions.length-1){current++;renderQ();}else showResult();
  },380);
}
function next(){if(answers[current]===undefined)return;if(current<questions.length-1){current++;renderQ();}else showResult();}
function prev(){if(current>0){current--;renderQ();}}

function calcScores(){
  var totals={};var counts={};
  questions.forEach(function(q,i){
    if(!totals[q.key]){totals[q.key]=0;counts[q.key]=0;}
    var raw=answers[i]||3;
    totals[q.key]+=(q.invert?(6-raw):raw);
    counts[q.key]++;
  });
  return categoryOrder.map(function(k){
    var q=questions.find(function(q){return q.key===k;});
    return{key:k,label:q.label,brain:q.brain,score:parseFloat((totals[k]/counts[k]).toFixed(2))};
  });
}

function calcFatigueScore(scored){
  var byKey={};
  scored.forEach(function(s){byKey[s.key]=s.score;});
  // command/emotion/memory は高いほど疲弊、movement/mindwander は低いほど不足（6-scoreで疲労側に揃える）
  var fatigueSum=byKey.command+byKey.emotion+byKey.memory+(6-byKey.movement)+(6-byKey.mindwander);
  var fatigue=Math.round(((fatigueSum-5)/20)*100); // 0〜100、高いほど脳疲労度が高い
  fatigue=Math.max(0,Math.min(100,fatigue));
  var rank,label;
  if(fatigue<20){rank='S';label='絶好調タイプ';}
  else if(fatigue<40){rank='A';label='バランス良好タイプ';}
  else if(fatigue<60){rank='B';label='ややお疲れタイプ';}
  else if(fatigue<80){rank='C';label='お疲れ気味タイプ';}
  else{rank='D';label='要注意タイプ';}
  return{score:fatigue,rank:rank,label:label};
}

function getSeverity(scores){
  var over=scores.filter(function(x){return x.score>=4.0;});
  if(!over.length)return'good';
  var max=over[0].score;
  if(max>=4.8)return'severe';
  if(max>=4.3)return'moderate';
  return'mild';
}

function findCombo(keys){
  for(var i=0;i<combos.length;i++){
    var c=combos[i];
    if(c.keys.filter(function(k){return keys.indexOf(k)>=0;}).length>=2)return c;
  }
  return null;
}

function buildRecoveryCard(item){
  var r=recoveryAdvice[item.key];
  if(!r)return'';
  var h='<div class="advice-card green">';
  h+='<div class="advice-head green">🟢 眠っている回路：'+(categoryMeta[item.key]?categoryMeta[item.key].emoji:'')+' '+item.label+'</div>';
  h+='<div class="advice-brain">関連する脳の部位：'+item.brain+'</div>';
  h+='<div class="advice-block"><div class="advice-block-title">⏰ 今夜できること</div>';
  r.tonight.forEach(function(a){h+='<div class="advice-item">・'+a+'</div>';});
  h+='</div>';
  h+='<div class="advice-block"><div class="advice-block-title">📅 今週やること</div>';
  r.week.forEach(function(a){h+='<div class="advice-item">・'+a+'</div>';});
  h+='</div>';
  h+='<div class="advice-block"><div class="advice-block-title">🏥 当院でできること</div>';
  r.clinic.forEach(function(a){h+='<div class="advice-clinic-item">・'+a+'</div>';});
  h+='</div>';
  h+='</div>';
  return h;
}

// ===== 前回結果の保存・比較（localStorageのみ・同一端末限定の軽量版） =====
var PREV_RESULT_KEY='nohirouCheckLastResult_v1';
var COMPARE_THRESHOLD=0.6; // これ以上の差があれば「変化あり」とみなす（1〜5点スケール）

function loadPreviousResult(){
  try{
    var raw=localStorage.getItem(PREV_RESULT_KEY);
    if(!raw)return null;
    var data=JSON.parse(raw);
    if(!data||!data.scores)return null;
    // 全カテゴリー分そろっているか確認（カテゴリー構成が変わった古いデータは無視）
    var ok=categoryOrder.every(function(k){return typeof data.scores[k]==='number';});
    return ok?data:null;
  }catch(e){return null;}
}

function saveCurrentResult(scored){
  try{
    var data={ts:Date.now(),scores:{}};
    scored.forEach(function(s){data.scores[s.key]=s.score;});
    localStorage.setItem(PREV_RESULT_KEY,JSON.stringify(data));
  }catch(e){/* 保存できない環境（プライベートモード等）では何もしない */}
}

// movement/mindwander は「スコアが高い＝良い」なので、疲労方向にそろえてから比較する
function fatigueDirection(key,score){
  return(key==='movement'||key==='mindwander')?(6-score):score;
}

function compareWithPrevious(scored,prevScores){
  return categoryOrder.map(function(k){
    var meta=categoryMeta[k];
    var cur=scored.find(function(s){return s.key===k;}).score;
    var prev=prevScores[k];
    var delta=fatigueDirection(k,cur)-fatigueDirection(k,prev);
    return{key:k,label:meta.label,emoji:meta.emoji,delta:delta};
  }).filter(function(item){return Math.abs(item.delta)>=COMPARE_THRESHOLD;})
    .sort(function(a,b){return Math.abs(b.delta)-Math.abs(a.delta);});
}

function showResult(){
  document.getElementById('q-screen').style.display='none';
  var rs=document.getElementById('result-screen');
  rs.classList.add('show');

  var scored=calcScores();
  var sortedByScore=[].concat(scored).sort(function(a,b){return b.score-a.score;});
  var overuse=sortedByScore.filter(function(x){return x.score>=4.0;}).slice(0,3);
  var dormant=sortedByScore.filter(function(x){return x.score<=2.0;}).reverse().slice(0,3);
  var severity=getSeverity(sortedByScore);

  var fatigue=calcFatigueScore(sortedByScore);
  var overuseKeys=overuse.map(function(x){return x.key;});
  var dormantKeys=dormant.map(function(x){return x.key;});
  var allKeys=overuseKeys.concat(dormantKeys);

  var prevResult=loadPreviousResult();
  var comparison=prevResult?compareWithPrevious(scored,prevResult.scores):[];
  var prevFatigue=prevResult?calcFatigueScore(categoryOrder.map(function(k){return{key:k,score:prevResult.scores[k]};})):null;

  var html='<div class="result-title">あなたの脳疲労レポート</div>';
  html+='<div class="result-sub">使いすぎている回路と、眠っている回路がわかりました</div>';
  html+='<div class="score-card"><div class="score-rank rank-'+fatigue.rank+'">'+fatigue.rank+'</div><div class="score-main"><div class="score-caption">脳疲労度</div><div class="score-number">'+fatigue.score+'<span class="score-unit">点</span></div><div class="score-label">'+fatigue.label+'</div></div></div>';

  // 前回との比較（同じ端末での再受診時のみ）
  if(prevResult){
    html+='<div class="compare-card"><div class="compare-title">📈 前回との比較</div>';
    var scoreTrendIcon=fatigue.score<prevFatigue.score?'🔽':(fatigue.score>prevFatigue.score?'🔼':'➡️');
    html+='<div class="compare-score-row">前回：<b>'+prevFatigue.score+'点</b>（'+prevFatigue.rank+'ランク） '+scoreTrendIcon+' 今回：<b>'+fatigue.score+'点</b>（'+fatigue.rank+'ランク）</div>';
    if(comparison.length>0){
      comparison.slice(0,2).forEach(function(item){
        var trend=item.delta<0?'回復傾向です':'お疲れ気味です';
        html+='<div class="compare-item">'+item.emoji+' '+item.label+'：前回より'+trend+'</div>';
      });
    } else {
      html+='<div class="compare-item">カテゴリー別では大きな変化はありませんでした</div>';
    }
    html+='</div>';
  } else {
    html+='<div class="compare-card compare-hint">📈 次回もこの端末で受けると、前回との比較が見られます</div>';
  }

  // 横棒グラフ
  html+='<div class="fullbar-section"><div class="fullbar-title">脳の回路バランス（全5項目）</div>';
  scored.forEach(function(item){
    var pct=Math.round((item.score-1)/4*100);
    var isOver=overuseKeys.indexOf(item.key)>=0;
    var isDorm=dormantKeys.indexOf(item.key)>=0;
    var cls=isOver?'overuse':isDorm?'dormant':'neutral';
    var tag=isOver?'<span class="fullbar-tag overuse">疲弊</span>':isDorm?'<span class="fullbar-tag dormant">眠り</span>':'<span class="fullbar-tag neutral"></span>';
    html+='<div class="fullbar-row"><div class="fullbar-label">'+(categoryMeta[item.key]?categoryMeta[item.key].emoji:'')+' '+item.label+'</div><div class="fullbar-track"><div class="fullbar-fill '+cls+'" style="width:0%" data-w="'+pct+'%"></div></div><div class="fullbar-score">'+item.score+'</div>'+tag+'</div>';
  });
  html+='</div>';

  if(severity==='good'){
    html+='<div class="no-result">今日はすべての脳回路がバランスよく使われています。<br>このまま良質な睡眠を取ることが最高の回復です。</div>';
  } else {
    // 複合パターン
    var combo=findCombo(allKeys);
    if(combo){
      html+='<div class="advice-card combo"><div class="advice-head combo">🔗 複合パターン：'+combo.title+'</div><div class="advice-item">'+combo.msg+'</div></div>';
    }

    // 疲弊1位
    if(overuse.length>0){
      var top=overuse[0];
      html+='<div class="advice-card red"><div class="advice-head red">🔴 今日いちばん疲弊した回路：'+(categoryMeta[top.key]?categoryMeta[top.key].emoji:'')+' '+top.label+'</div>';
      html+='<div class="advice-brain">関連する脳の部位：'+top.brain+'</div>';
      html+='<div class="advice-block-title" style="font-size:12px;font-weight:600;color:#555;margin-bottom:4px">今夜の回復アクション</div>';
      (overuseAdvice[top.key]||[]).forEach(function(a){html+='<div class="advice-item">・'+a+'</div>';});
      html+='</div>';
    }

    html+='<div class="section-divider"></div>';

    // 眠っている回路トップ3（各3ブロック）
    if(dormant.length>0){
      html+='<div style="font-size:14px;font-weight:600;color:#085041;margin-bottom:1rem">🟢 眠っている回路の回復プログラム</div>';
      dormant.forEach(function(item){
        html+=buildRecoveryCard(item);
      });
    }
  }

  // 参考表
  html+='<div class="section-divider"></div>';
  html+='<div class="ref-section"><div class="ref-title">📊 参考：日常の活動と脳の部位の関係</div>';
  html+='<table class="ref-table"><thead><tr><th>活動の種類</th><th>主な脳の部位</th></tr></thead><tbody>';
  refTable.forEach(function(row){
    var isOver=overuseKeys.indexOf(row.key)>=0;
    var isDorm=dormantKeys.indexOf(row.key)>=0;
    var cls=isOver?' class="hl-over"':isDorm?' class="hl-dorm"':'';
    var dot=isOver?'<span class="ref-dot" style="background:#E24B4A"></span>':isDorm?'<span class="ref-dot" style="background:#1D9E75"></span>':'';
    html+='<tr'+cls+'><td>'+dot+(categoryMeta[row.key]?categoryMeta[row.key].emoji:'')+' '+row.label+'</td><td>'+row.brain+'</td></tr>';
  });
  html+='</tbody></table>';
  html+='<div style="font-size:11px;color:#aaa;margin-top:6px"><span style="display:inline-flex;align-items:center;gap:3px"><span class="ref-dot" style="background:#E24B4A"></span>疲弊している回路</span>　<span style="display:inline-flex;align-items:center;gap:3px"><span class="ref-dot" style="background:#1D9E75"></span>眠っている回路</span></div>';
  html+='</div>';

  html+='<div class="cta-card"><div class="cta-title">脳のバランスを身体から整えたい方へ</div>';
  html+='<div class="cta-body">かみふくろう整骨院・整体院では、脳の回路バランスに基づいた姿勢・呼吸・行動設計のプログラムをご提供しています。まずはLINEでお気軽にご相談ください。</div>';
  html+='<div style="margin-top:1rem;display:flex;flex-direction:column;align-items:center;gap:0.75rem">';
  html+='<a href="https://lin.ee/tdz9yCv" target="_blank" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#06C755;color:#fff;font-weight:700;font-size:15px;padding:0.75rem 2rem;border-radius:99px;text-decoration:none;letter-spacing:0.03em;width:100%">&#10004; LINEで友だち追加して相談する</a>';
  html+='<a href="https://kamifukurou.com" target="_blank" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:#534AB7;font-weight:600;font-size:14px;padding:0.6rem 2rem;border-radius:99px;text-decoration:none;border:1.5px solid #AFA9EC;width:100%">&#127968; かみふくろう整骨院・整体院 公式サイトを見る</a>';
  html+='</div></div>';
  html+='<button class="restart-btn" onclick="restart()">↺ もう一度診断する</button>';

  rs.innerHTML=html;
  setTimeout(function(){
    rs.querySelectorAll('[data-w]').forEach(function(b){b.style.width=b.getAttribute('data-w');});
  },100);
  saveCurrentResult(scored); // 今回の結果を「次回比較用」として保存
}

function restart(){
  answers={};current=0;
  document.getElementById('q-screen').style.display='block';
  var rs=document.getElementById('result-screen');
  rs.classList.remove('show');rs.innerHTML='';
  renderQ();
}

initDots();renderQ();
</script>
